name = "rtl433"
version = "1.0.0"
meshpoint_api = 1
provides = ["listener", "routes", "hook"]
locked = true  # shipped with this fork -- not user-installed, can't be deleted

[deps]
apt = ["rtl-433"]
setup = "setup.sh"

[frontend]
scripts = ["frontend/rtl433_panel.js"]

[hook]
host = "rtlsdr"    # lives on the rtlsdr plugin's page, not the built-in
                    # Listener page -- see plugins/apps/rtlsdr/README.md

[meta]
description = "Generic RTL-SDR OOK/FSK decoder (rtl_433) -- weather stations, TPMS, remote sensors, and hundreds of other 433/315/868 MHz devices"
homepage = "https://github.com/merbanan/rtl_433"
author = "Einstein PD2EMC"
