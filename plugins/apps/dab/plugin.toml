name = "dab"
version = "1.0.0"
meshpoint_api = 1
provides = ["listener", "routes", "panel", "hook"]
locked = true  # shipped with this fork -- not user-installed, can't be deleted

[deps]
apt = ["welle.io"]
setup = "setup.sh"

[frontend]
scripts = ["frontend/dab_panel.js", "frontend/dab_config_panel.js", "frontend/dab_rtlsdr_hook.js"]
styles = ["frontend/dab_panel.css"]

[hook]
host = "rtlsdr"    # a small status card on the rtlsdr plugin's page --
                    # see frontend/dab_rtlsdr_hook.js. Test case for the
                    # "hook" seam against a real, non-trivial plugin
                    # (plugins/apps/rtlsdr/README.md has the full context).

[meta]
description = "DAB/DAB+ digital radio via welle-cli -- channel scan, live tuning/playback, and per-channel display names"
homepage = "https://github.com/AlbrechtL/welle.io"
author = "Einstein PD2EMC"
