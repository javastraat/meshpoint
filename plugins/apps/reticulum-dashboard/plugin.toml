name = "reticulum-dashboard"
version = "1.0.0"
meshpoint_api = 1
provides = ["sidebar"]    # a whole top-level sidebar page of its own -- see
                           # [sidebar] below and window.registerSidebarPage().
                           # No "routes": this page has no backend of its
                           # own, it reads the reticulum plugin's existing
                           # /api/reticulum/* endpoints + the shared
                           # dashboard WebSocket instead (see backend/README).
locked = true  # shipped with this fork -- not user-installed, can't be deleted
requires = "reticulum"  # not a [hook] -- this page doesn't attach to
                         # reticulum's own page, it just has nothing to show
                         # without it running. Enforced the same way a hook's
                         # [hook].host is: PUT /api/plugins/reticulum-dashboard
                         # refuses to enable it until reticulum is enabled,
                         # and disabling reticulum cascades to disable this
                         # too (src/api/routes/plugin_routes.py).

[frontend]
scripts = ["frontend/reticulum_dashboard.js"]
styles = ["frontend/reticulum_dashboard.css"]
# Most of the look reuses core's stat-card / lw-* / panel / packet-row--new
# classes (dashboard.css + lorawan.css), both loaded globally already --
# same reuse the reticulum plugin's own page relies on. The one own
# stylesheet holds the two-column map+peers grid and a copy of the
# reticulum plugin's telemetry-map/popup rules (asset serving is scoped
# per-plugin, so its reticulum.css isn't reachable from here).

[sidebar]
route = "reticulum-dashboard"
label = "Reticulum Dashboard"
category = "networks"
icon = "reticulum"    # same glyph as the reticulum plugin's own nav item --
                       # icon names are a shared curated set, not exclusive
                       # to one plugin (see sidebar_plugin_registry.js).

[meta]
description = "A live, standalone view of Reticulum activity -- stat cards, a telemetry map of located peers, a live peer list, and a flashing real-time announce ticker. Companion to the reticulum plugin's own Peers/Messages/Settings page; requires reticulum enabled to show data."
homepage = "https://reticulum.network"
author = "Einstein PD2EMC"
