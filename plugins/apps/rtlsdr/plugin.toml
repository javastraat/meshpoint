name = "rtlsdr"
version = "0.1.0"
meshpoint_api = 1
provides = ["sidebar"]    # capabilities this plugin uses -- non-empty subset of:
                           #   listener  register an RTL-SDR subprocess listener
                           #             (shares the one physical dongle with
                           #             every other listener) -- reg.add_listener()
                           #   routes    mount a FastAPI router under /api/<...>
                           #             -- reg.add_router()
                           #   panel     add a sub-tab to the Listener page
                           #             (window.registerListenerPanel)
                           #   sidebar   add a whole top-level sidebar page of
                           #             your own (this plugin) -- see [sidebar]
                           #             below and window.registerSidebarPage()
                           #   hook      inject content into ANOTHER plugin's
                           #             page -- see the DAB+ plugin, which
                           #             hooks a small status card into THIS
                           #             page's [hook] mount point
                           # Using a capability not listed here raises at
                           # register-time (PluginRegistry._require). See
                           # docs/PLUGINS.md and the ACARS plugin for a
                           # listener + routes + panel worked example.
locked = true  # shipped with this fork -- not user-installed, can't be deleted

[deps]
setup = "setup.sh"    # builds librtlsdr from source + blacklists the
                       # kernel DVB-T stack -- the one shared, hardware-
                       # level dependency every RTL-SDR plugin needs

[frontend]
scripts = ["frontend/rtlsdr_panel.js"]
styles = ["frontend/rtlsdr_panel.css"]

[sidebar]
route = "rtlsdr"          # -> #/rtlsdr
label = "RTL-SDR"         # sidebar link text -- briefly had to be "RTL-SDR
                           # Plugins" instead while the built-in Listener
                           # page's own nav item (same label) still existed
                           # alongside this one (caught live on the Pi --
                           # two identical-looking entries was confusing).
                           # Radio migrating here too and that page being
                           # deleted freed the plain label back up.
category = "radio"        # same sidebar section Radio's old nav item sat in
icon = "usb"              # exact copy of that old nav item's own USB
                           # dongle glyph -- RTL-SDR is literally a USB
                           # stick, kept when its own sidebar item was
                           # deleted so this page could inherit it

[meta]
description = "The RTL-SDR host page -- every RTL-SDR plugin (Radio, DAB+, P2000, Pagers, POCSAG, RTL433, ADS-B, ACARS) hooks its own tab into this page via the 'hook' seam instead of owning a page of its own."
homepage = "https://github.com/KMX415/meshpoint"
author = "Einstein PD2EMC"
