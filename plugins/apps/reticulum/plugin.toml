name = "reticulum"
version = "1.0.0"
meshpoint_api = 1
provides = ["service", "routes"]   # Phase 1 scaffold -- backend only.
                                    #   service  the LxmfService (RNS/LXMF
                                    #            client attach), started right
                                    #            after the pipeline is up,
                                    #            stopped on shutdown
                                    #   routes   /api/reticulum/* (status,
                                    #            peers, messages, send, announce)
                                    # "sidebar" + "topbar" (the page + the
                                    # topbar pill) land in Phase 2 with the
                                    # frontend. See memory/plugin-reticulum.md.
locked = true  # shipped with this fork -- not user-installed, can't be deleted

[meta]
description = "Native Reticulum/LXMF messaging -- meshpoint's own LXMF delivery destination on the local rnsd shared instance, plus the peer roster built from announces. Being extracted from core; not user-visible until enabled (Phase 4)."
homepage = "https://reticulum.network"
author = "Einstein PD2EMC"
