name = "reticulum"
version = "1.0.0"
meshpoint_api = 1
provides = ["service", "routes", "sidebar", "topbar"]
                                    #   service  the LxmfService (RNS/LXMF
                                    #            client attach), started right
                                    #            after the pipeline is up,
                                    #            stopped on shutdown
                                    #   routes   /api/reticulum/* (status, peers,
                                    #            messages, send, announce,
                                    #            nomad/*) + /api/config/reticulum
                                    #   sidebar  the Reticulum page (Peers /
                                    #            Messages / Send / Browse /
                                    #            Settings tabs)
                                    #   topbar   the compact status pill
locked = true  # shipped with this fork -- not user-installed, can't be deleted

[deps]
setup = "setup.sh"   # pip install lxmf + install/enable the rnsd systemd unit
check = "check.sh"   # unprivileged probe: lxmf in venv + rnsd.service installed
                     # and enabled. Settings -> Plugins shows "setup needed" when
                     # this fails instead of the always-on install hint.

[frontend]
scripts = [
    "frontend/reticulum_micron.js",
    "frontend/reticulum_detail_panels.js",
    "frontend/reticulum_panel.js",
    "frontend/reticulum_settings_tab.js",
    "frontend/reticulum_nomad.js",
    "frontend/reticulum_node_pages_tab.js",
    "frontend/reticulum_topbar_chip.js",
]
styles = ["frontend/reticulum.css"]

[sidebar]
route = "reticulum"
label = "Reticulum"
category = "networks"
icon = "reticulum"    # exact copy of the old built-in nav item's own glyph

[meta]
description = "Native Reticulum/LXMF messaging -- meshpoint's own LXMF delivery destination on the local rnsd shared instance, the peer roster built from announces, the Reticulum page (Peers/Messages/Send/Settings) and a compact topbar pill."
homepage = "https://reticulum.network"
author = "Einstein PD2EMC"
