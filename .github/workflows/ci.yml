name: CI

on:
  push:
    branches:
      - main
      # Sprint + feature branches (e.g. feat/v0.7.8) — validate before merge to main.
      - "feat/**"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # ruff pinned: unpinned installs pick up whatever's newest at CI run
        # time, and ruff 0.16.0 broadened its default lint rule set (adding
        # UP045 "Optional[X] -> X | None" among others) -- every version
        # through 0.15.1 passes this repo cleanly with zero config changes.
        # Bump this deliberately (and fix/ignore whatever it newly flags)
        # rather than letting it drift and fail on an unrelated PR again.
        run: pip install -r requirements.txt "ruff==0.15.1" pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check src/ tests/ plugins/

      - name: Run tests
        run: python -m pytest tests/ plugins/ -v --ignore=tests/test_crypto_service.py --ignore=tests/test_meshtastic_decoder.py --ignore=tests/test_meshcore_decoder.py
